<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001f3f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000814" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="#000814"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="#0077b6" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="175" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.6"/>
  <text x="256" y="310" text-anchor="middle"
        font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="210" font-weight="900"
        fill="#00b4d8" filter="url(#glow)">B</text>
  <text x="256" y="395" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, Helvetica, sans-serif"
        font-size="28" font-weight="500" letter-spacing="12"
        fill="#90e0ef" opacity="0.8">ORON</text>
</svg>
